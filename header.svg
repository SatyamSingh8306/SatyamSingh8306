<svg width="100%" viewBox="0 0 680 120" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Satyam Singh — AI Engineer · Founder · Builder</title>
  <desc>Custom geometric name header for GitHub profile README</desc>

  <!-- left accent -->
  <line x1="40" y1="60" x2="200" y2="60" stroke="#58a6ff" stroke-width="0.5"/>
  <polygon points="210,60 222,53 222,67" fill="#58a6ff"/>

  <!-- name -->
  <text x="240" y="52" font-family="monospace" font-size="28" font-weight="700" fill="#e6edf3" letter-spacing="6">SATYAM</text>
  <text x="240" y="82" font-family="monospace" font-size="28" font-weight="700" fill="#58a6ff" letter-spacing="6">SINGH</text>

  <!-- right accent -->
  <line x1="480" y1="60" x2="640" y2="60" stroke="#58a6ff" stroke-width="0.5"/>
  <polygon points="470,60 458,53 458,67" fill="#58a6ff"/>

  <!-- divider + tagline -->
  <rect x="240" y="90" width="240" height="0.5" fill="#30363d"/>
  <text x="240" y="108" font-family="monospace" font-size="11" fill="#8b949e" letter-spacing="2">AI ENGINEER · FOUNDER · BUILDER</text>
</svg>
